# URL and deployment
url: "https://blog.lqh2011.com"
baseurl: ""

# No remote theme — using custom local layouts
# remote_theme: pages-themes/minimal@v0.2.0

# Plugins supported natively by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown rendering
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Site metadata
title: "Blog de Jesús"
tagline: "Blog personal de un chino que habla castellano."
description: "Blog personal de un chino que habla castellano."
lang: "es-ES"
timezone: "Asia/Shanghai"

# Author
author:
  name: "Jesús Luo"
  bio: "Un chino que habla castellano."
  location: "Nanjing, China"
  url: "https://lqh2011.com"
  signoff: "—Jesús"

email: jesus@lqh2011.com

# Social
github_username: LQH-2011
social_links:
  - name: Discord
    url: https://discord.gg/swQTTjxg
  - name: GitHub
    url: https://github.com/LQH-2011

# Navigation
nav_icon: "J"

# Permalink style
permalink: /:year/:month/:day/:title/

# Default front matter for posts
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      disclaimer: "Estas son mis opiniones personales y no representan ninguna organización ni consejo profesional."
