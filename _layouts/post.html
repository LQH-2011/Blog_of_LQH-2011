---
layout: default
---

<p>{% for tag in page.tags %}#<a href="{{ "/tags" | relative_url }}#{{ tag | slugify }}">{{ tag }}</a> {% endfor %}</p>
<p><em>{{ page.date | date: "%a, %d %b %Y %H:%M:%S %z" }}</em></p>
<h1>{{ page.title }}</h1>

{{ content }}

<p class="r" id="q"><i>{{ site.author.signoff | default: "—" }}</i></p>
